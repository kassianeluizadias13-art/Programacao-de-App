<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico.png" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <script src="index.js"></script>

</head>
<body>
    <main class="container">
        <header class="header">
            <div>
                <h1><strong>Minhas tarefas</strong></h1> 
                <p>Organize seu dia e sua rotina</p>
            </div>
            <span class="material-symbols-outlined header-icon">
                checklist
            </span> 
        </header>
                <div class="form-tarefa">
                    <input type="text" id="input-tarefa" placeholder="Oque você precisa fazer?"/>
                    <button type="button">
                        <span class="material-symbols-outlined">
                        add_circle
                        </span>
                        Adicionar
                    </button>
                </div>
                <nav class="filtros">
                    <button type="button" class="filtro-ativo">Todas</button>
                    <button type="button" class="filtro">Pendentes</button>
                    <button type="button" class="filtro">Concluidas</button>

                </nav>
                <ul id="lista-tarefas" class="lista-tarefas" >
                    <li class="tarefa tarefa-concluida">
                        <button class="botao-check">
                            <span class="material-symbols-outlined">
                        radio_button_unchecked
                            </span>
                        </button>
                    

                    <span class="tarefa-texto">Estudar JavaScript</span>

                    <button class="botao-excluir">
                        <span class="material-symbols-outlined" onclick="excluirTarefa()">
                            delete
                        </span>
                    </button>
                    </li>
                </ul>
    </main>

</body>
</html>
